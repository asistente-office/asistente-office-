<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistencia Personal IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600;800&display=swap');
  :root{
    --bg:#0B0D12; --panel:#1F2430; --panel2:#262C3B;
    --word:#2B579A; --excel:#217346; --ppt:#D24726; --outlook:#0072C6;
    --ink:#EDEFF5; --ink-dim:#9BA0B4;
    --key-face:#2E3446; --key-edge:#12151D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 80% 0%, rgba(43,87,154,0.15), transparent 45%), var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .card{
    width:100%; max-width:520px;
    height:88vh; max-height:720px;
    background:var(--panel);
    border-radius:22px;
    border:1px solid rgba(255,255,255,0.05);
    box-shadow:0 30px 60px rgba(0,0,0,0.45);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    flex-shrink:0;
  }
  header h1{
    font-family:'JetBrains Mono',monospace;
    font-size:18px; font-weight:700;
  }
  header h1 span{ color:var(--excel); }
  header p{ color:var(--ink-dim); font-size:12px; margin-top:3px; }

  .chat{
    flex:1;
    overflow-y:auto;
    padding:18px 18px 6px;
    display:flex; flex-direction:column; gap:12px;
  }
  .msg{
    max-width:85%;
    padding:10px 13px;
    border-radius:14px;
    font-size:13.5px;
    line-height:1.45;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--word);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--panel2);
    border:1px solid rgba(255,255,255,0.06);
    border-bottom-left-radius:4px;
  }
  .msg.bot .key{
    font-family:'JetBrains Mono',monospace;
    background:var(--key-face);
    border:1px solid var(--key-edge);
    border-bottom:2px solid var(--key-edge);
    border-radius:5px;
    padding:1px 6px;
    font-size:12px;
  }
  .msg.system{
    align-self:center;
    color:var(--ink-dim);
    font-size:11.5px;
    text-align:center;
  }
  .typing{
    align-self:flex-start;
    display:flex; gap:4px;
    padding:10px 13px;
    background:var(--panel2);
    border-radius:14px;
    border-bottom-left-radius:4px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--ink-dim);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0);opacity:.4;} 30%{transform:translateY(-4px);opacity:1;} }

  .quick-row{
    display:flex; gap:8px; flex-wrap:wrap;
    padding:0 18px 12px;
    flex-shrink:0;
  }
  .quick{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    background:var(--panel2);
    border:1px solid rgba(255,255,255,0.08);
    color:var(--ink-dim);
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  .quick:hover{ color:var(--ink); border-color:var(--excel); }

  form{
    display:flex; gap:8px;
    padding:14px 16px;
    border-top:1px solid rgba(255,255,255,0.06);
    flex-shrink:0;
  }
  input[type=text]{
    flex:1;
    background:var(--panel2);
    border:1px solid rgba(255,255,255,0.08);
    color:var(--ink);
    border-radius:10px;
    padding:11px 13px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    outline:none;
  }
  input[type=text]:focus{ border-color:var(--excel); }
  button.send{
    background:var(--excel); color:#fff; border:none;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
    padding:0 18px; border-radius:10px; cursor:pointer;
  }
  button.send:disabled{ opacity:.5; cursor:default; }

  .chat::-webkit-scrollbar{ width:6px; }
  .chat::-webkit-scrollbar-thumb{ background:var(--key-face); border-radius:3px; }
</style>
</head>
<body>
  <div class="card">
    <header>
      <h1>ASISTENCIA PERSONAL <span>//</span> IA</h1>
      <p>Pregunta cualquier comando o atajo que no esté en tu mousepad</p>
    </header>

    <div class="chat" id="chat">
      <div class="msg system">Escaneaste el QR de tu mousepad 👋 Solo respondo dudas de Microsoft Office (Word, Excel, PowerPoint, Outlook). ¿Qué necesitas saber?</div>
    </div>

    <div class="quick-row" id="quickRow">
      <div class="quick" data-q="¿Cómo hago una tabla dinámica en Excel?">Tabla dinámica Excel</div>
      <div class="quick" data-q="¿Cómo combino correspondencia en Word?">Combinar correspondencia</div>
      <div class="quick" data-q="¿Cómo pongo transiciones automáticas en PowerPoint?">Transiciones automáticas</div>
    </div>

    <form id="chatForm">
      <input type="text" id="input" placeholder="Ej: ¿cómo bloqueo una fórmula en Excel?" autocomplete="off" />
      <button class="send" id="sendBtn" type="submit">Enviar</button>
    </form>
  </div>

<script>
const SYSTEM_PROMPT = `Eres un asistente que SOLO responde preguntas sobre Microsoft Office: Word, Excel, PowerPoint, Outlook, Teams y OneNote (comandos, atajos, fórmulas, pasos, funciones).
Si te preguntan algo que no sea sobre Microsoft Office, responde exactamente: "Solo puedo ayudarte con temas de Microsoft Office 🙂 ¿Qué necesitas saber de Word, Excel, PowerPoint u Outlook?" y no respondas nada más de ese tema.
Responde en español, breve y claro, en pasos numerados si es un procedimiento. Los atajos de teclado escríbelos así: [Ctrl] + [Tecla]. No uses asteriscos ni markdown.`;

const chat = document.getElementById('chat');
const form = document.getElementById('chatForm');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const quickRow = document.getElementById('quickRow');

let history = [];

function addMessage(role, html){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function removeTyping(){
  const t = document.getElementById('typingIndicator');
  if(t) t.remove();
}

async function sendMessage(text){
  if(!text.trim()) return;
  quickRow.style.display = 'none';
  addMessage('user', escapeHtml(text));
  const userTurn = { role: 'user', content: text };
  input.value = '';
  sendBtn.disabled = true;
  addTyping();

  // Construimos el prompt como conversación en texto plano (más compatible vía GET)
  let convo = '';
  history.forEach(m => {
    convo += (m.role === 'user' ? 'Usuario: ' : 'Asistente: ') + m.content + '\n';
  });
  convo += 'Usuario: ' + text;

  const url = 'https://text.pollinations.ai/' + encodeURIComponent(convo)
    + '?model=openai&system=' + encodeURIComponent(SYSTEM_PROMPT);

  try{
    const response = await fetch(url, { method: 'GET' });
    if(!response.ok){ throw new Error('HTTP ' + response.status); }
    const reply = (await response.text()).trim();
    removeTyping();
    if(!reply){
      addMessage('bot', '(La IA devolvió una respuesta vacía — puede ser límite de uso temporal. Espera unos segundos e intenta de nuevo.)');
    } else {
      addMessage('bot', reply);
      history.push(userTurn);
      history.push({ role: 'assistant', content: reply });
    }
  }catch(err){
    removeTyping();
    addMessage('bot', 'Ocurrió un error de conexión (' + err.message + '). Intenta de nuevo en un momento.');
    console.error(err);
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  sendMessage(input.value);
});

quickRow.querySelectorAll('.quick').forEach(el => {
  el.addEventListener('click', () => sendMessage(el.dataset.q));
});
</script>
</body>
</html>
